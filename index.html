<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>POKÉDESAFÍO v3.0 — Región Ámbar</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script>
      window.__pokeErrors = [];
      window.__pokeBooted = false;
      window.addEventListener("error", function (e) {
        window.__pokeErrors.push(
          (e.message || "error") + " @lin " + (e.lineno || "?"),
        );
        window.__showErr();
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__pokeErrors.push(
          "Promesa: " + ((e.reason && e.reason.message) || e.reason),
        );
        window.__showErr();
      });
      window.__showErr = function () {
        var b = document.getElementById("bootErr");
        if (!b) return;
        b.style.display = "block";
        b.style.background = "#d32f2f";
        b.textContent =
          "⛔ ERROR: " + window.__pokeErrors.join(" | ").slice(0, 400);
      };
      window.addEventListener("load", function () {
        setTimeout(function () {
          if (!window.__pokeBooted) {
            var b = document.getElementById("bootErr");
            if (b) {
              b.style.display = "block";
              b.style.background = "#d32f2f";
              b.textContent =
                "⛔ No arrancó. " +
                (window.__pokeErrors.length
                  ? "Errores: " + window.__pokeErrors.join(" | ").slice(0, 350)
                  : "¿Están los 5 archivos en la misma carpeta?");
            }
          }
        }, 900);
      });
    </script>
  </head>
  <body>
    <div id="bootErr"></div>
    <div id="app">
      <div id="statusBar"></div>
      <div id="content"></div>
      <div id="buttonBar"></div>
    </div>
    <div class="ovl" id="ovDlg">
      <div class="ovl-card">
        <div
          id="dlgWho"
          class="px"
          style="font-size: 10px; color: var(--blue)"
        ></div>
        <p
          id="dlgTxt"
          style="font-size: 14px; line-height: 1.5; min-height: 50px"
        ></p>
        <div
          id="dlgChoices"
          style="
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
          "
        ></div>
        <button class="btn-big grn" id="dlgNext" type="button">
          CONTINUAR ▸
        </button>
      </div>
    </div>
    <div class="ovl" id="ovInf">
      <div class="ovl-card win">
        <h2>⚔️ DESAFÍO INFINITO</h2>
        <p id="infStats" style="font-size: 13px"></p>
        <div id="infTeam" style="text-align: left; margin-top: 8px"></div>
        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
          "
        >
          <button class="btn-big grn" id="infNextBtn" type="button">
            ⚔️ SIGUIENTE BATALLA (GRATIS)
          </button>
          <button class="btn-big ylw" id="infTeamBtn" type="button">
            👥 VER EQUIPO
          </button>
          <button class="btn-big red" id="infExitBtn" type="button">
            🚪 SALIR
          </button>
        </div>
      </div>
    </div>
    <div class="ovl" id="ovContinue">
      <div class="ovl-card lose">
        <h2>💀 EQUIPO DERROTADO</h2>
        <p id="contText"></p>
        <p id="contCost" style="color: #c0392b"></p>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <button class="btn-big grn" id="contYes" type="button">
            ⚡ CONTINUAR
          </button>
          <button class="btn-big ylw" id="contBuy" type="button">
            🪙 COMPRAR +1⚡ (100🪙)
          </button>
          <button class="btn-big red" id="contNo" type="button">
            🚪 SALIR
          </button>
        </div>
      </div>
    </div>
    <div class="ovl" id="ovName">
      <div class="ovl-card">
        <h2>🗺️ NUEVA AVENTURA</h2>
        <p>¿Cómo te llamas, entrenador/a?</p>
        <input
          id="advNameInput"
          maxlength="12"
          placeholder="ENTRENADOR"
          style="
            font-family: &quot;Press Start 2P&quot;;
            font-size: 10px;
            padding: 10px;
            border: 3px solid var(--ink);
            border-radius: 9px;
            width: 90%;
            max-width: 260px;
            text-transform: uppercase;
          "
        />
        <div
          style="
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
          "
        >
          <button class="btn-big grn" id="advNameOk" type="button">
            ¡EMPEZAR!
          </button>
          <button class="btn-big" id="advNameBack" type="button">◂</button>
        </div>
      </div>
    </div>
    <div class="ovl" id="ovNick">
      <div class="ovl-card win">
        <h2>¡CAPTURADO!</h2>
        <img
          id="nickArt"
          style="width: 100px; height: 100px; object-fit: contain"
        />
        <p id="nickTitle" class="px" style="font-size: 10px"></p>
        <input
          id="nickInput"
          maxlength="12"
          placeholder="Mote…"
          style="
            font-family: &quot;Press Start 2P&quot;;
            font-size: 10px;
            padding: 9px;
            border: 3px solid var(--ink);
            border-radius: 9px;
            width: 90%;
            max-width: 240px;
          "
        />
        <div
          style="
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
          "
        >
          <button class="btn-big grn" id="nickOk" type="button">
            ¡PONER MOTE!
          </button>
          <button class="btn-big" id="nickSkip" type="button">SIN MOTE</button>
        </div>
      </div>
    </div>
    <div class="ovl" id="ovBadge">
      <div class="ovl-card win">
        <div
          id="confetti"
          style="
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
          "
        ></div>
        <div style="font-size: 50px" id="badgeIcon">🏅</div>
        <h2 id="badgeName">MEDALLA</h2>
        <p id="badgeTxt"></p>
        <button class="btn-big ylw" id="badgeOk" type="button">
          ¡GENIAL! ▸
        </button>
      </div>
    </div>
    <div class="ovl" id="ovBag">
      <div class="ovl-card" style="max-width: 340px">
        <h2>🎒 MOCHILA</h2>
        <div id="bagList"></div>
        <button class="btn-big" id="bagClose" type="button">CERRAR ✕</button>
      </div>
    </div>
    <div class="ovl" id="ovSwap">
      <div class="ovl-card" style="max-width: 360px">
        <h2 id="swapTitle">🔄 CAMBIAR POKÉMON</h2>
        <p id="swapHint" style="font-size: 12px; color: #666"></p>
        <div id="swapList"></div>
        <button class="btn-big" id="swapClose" type="button">CANCELAR</button>
      </div>
    </div>
    <div class="ovl" id="ovPts">
      <div class="ovl-card" style="max-width: 380px">
        <h2>📊 REPARTIR PUNTOS</h2>
        <p id="ptsInfo"></p>
        <div id="ptsRows" style="text-align: left"></div>
        <div
          style="
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
          "
        >
          <button class="btn-big ylw" id="ptsAuto" type="button">
            AUTOREPARTO
          </button>
          <button class="btn-big" id="ptsClose" type="button">LISTO</button>
        </div>
      </div>
    </div>
    <div class="ovl" id="ovDexMon">
      <div class="ovl-card win" style="max-width: 360px">
        <div id="dexMonBox"></div>
        <button class="btn-big" id="dexMonClose" type="button">CERRAR</button>
      </div>
    </div>
    <div class="ovl" id="ovConfirm">
      <div class="ovl-card" style="max-width: 320px">
        <p id="cfTxt" style="font-size: 14px; line-height: 1.4"></p>
        <div
          style="
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
          "
        >
          <button class="btn-big red" id="cfYes" type="button">SÍ</button>
          <button class="btn-big" id="cfNo" type="button">NO</button>
        </div>
      </div>
    </div>
    <div id="toast"></div>
    <div id="saveInd">💾 Guardado</div>
    <script src="data.js"></script>
    <script src="core.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
